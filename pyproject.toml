[project]
name = "integration-zwave"
version = "0.1.0"
description = ""
authors = [
    {name = "Ehor Lukianov",email = "ehorlukianov@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "majordom-integration-sdk (>=0.1.2,<0.2.0)",
    "zwave-js-server-python (>=0.73.1,<0.74.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"